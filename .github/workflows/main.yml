name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Create test environment file
      run: |
        echo "MONDAY_API_TOKEN=${{ secrets.MONDAY_API_TOKEN }}" > .env.test
        echo "MONDAY_BOARD_ID=${{ secrets.MONDAY_BOARD_ID }}" >> .env.test
        echo "BASE_USER_PATH=/tmp" >> .env.test
        echo "MODEL_FILE_PATH=/tmp/modelo.vsdx" >> .env.test
        echo "PORT=3000" >> .env.test
        echo "NODE_ENV=test" >> .env.test
    
    - name: Run tests
      run: npm test
      
  deploy-to-render:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Render
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      
    - name: Verify deployment
      run: |
        echo "Deployment triggered. Check Render dashboard for status."
        echo "Health check will be available at: https://monday-api-automation.onrender.com/health"